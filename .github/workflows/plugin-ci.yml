name: Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out pinned Codex validators
        uses: actions/checkout@v5
        with:
          repository: openai/codex
          ref: 61a44880a85d2fd0d8770908dea5733495e571c8
          path: .ci/openai-codex
          persist-credentials: false
          sparse-checkout: |
            codex-rs/skills/src/assets/samples/plugin-creator
            codex-rs/skills/src/assets/samples/skill-creator

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run plugin checks
        env:
          CODEX_PLUGIN_VALIDATOR: ${{ github.workspace }}/.ci/openai-codex/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
          CODEX_SKILL_VALIDATOR: ${{ github.workspace }}/.ci/openai-codex/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py
        run: bash scripts/test_plugin.sh

  claude:
    name: Validate Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://code.claude.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Record Claude Code version
        run: claude --version

      - name: Validate plugin and marketplace
        run: |
          claude plugin validate plugins/hotspot-to-rq --strict
          claude plugin validate . --strict
